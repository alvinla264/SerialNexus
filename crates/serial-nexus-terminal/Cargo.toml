[package]
name = "serial-nexus-terminal"
description = "Human terminal for SerialNexus: a minicom-like TUI on the shared core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64.workspace = true
crossbeam-channel.workspace = true
libc.workspace = true
# `use-dev-tty` selects crossterm's level-triggered poll reader. The default
# mio reader is edge-triggered and stops draining stdin as soon as it parses
# one event, stranding a large paste (or keys after it) until new input
# arrives; see the regression in tests/pty_sharing.rs.
crossterm = { version = "0.28", features = ["use-dev-tty"] }
ratatui = "0.29"
serial-nexus-client = { path = "../serial-nexus-client" }
serial-nexus-protocol = { path = "../serial-nexus-protocol" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
unicode-width.workspace = true

[dev-dependencies]
nix.workspace = true
serial-nexus-core = { path = "../serial-nexus-core" }
tempfile = "3"
vt100 = "0.15"
